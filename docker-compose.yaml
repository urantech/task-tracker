services:
  postgres:
    image: postgres:15-alpine
    container_name: task-tracker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-tracker-net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres1:
    image: postgres:15-alpine
    container_name: cron-service-db
    environment:
      POSTGRES_USER: ${POSTGRES_1_USER}
      POSTGRES_PASSWORD: ${POSTGRES_1_PASSWORD}
      POSTGRES_DB: ${POSTGRES_1_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres1_data:/var/lib/postgresql/data
    networks:
      - task-tracker-net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_1_USER}", "-d", "${POSTGRES_1_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: kafka-kraft
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - task-tracker-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5

  backend-api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    image: backend-api:latest
    container_name: backend-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      BACKEND_API_HTTP_PORT: ${BACKEND_API_HTTP_PORT}
      BACKEND_API_GRPC_PORT: ${BACKEND_API_GRPC_PORT}
      BACKEND_API_DB_URL: ${BACKEND_API_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
    networks:
      - task-tracker-net
    restart: unless-stopped
  
  cron-service:
    build:
      context: .
      dockerfile: cron-service/Dockerfile
    image: cron-service:latest
    container_name: cron-service
    depends_on:
      postgres1:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      CRON_SERVICE_DB_URL: ${CRON_SERVICE_DB_URL}
      BACKEND_API_GRPC_ADDR: ${BACKEND_API_GRPC_ADDR}
    networks:
      - task-tracker-net
    restart: unless-stopped

volumes:
  postgres_data:
  postgres1_data:
  kafka_data:

networks:
  task-tracker-net:
    driver: bridge
